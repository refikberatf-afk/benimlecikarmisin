<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bişey Sorabilir miyim? ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. AŞAMA: Utangaç kedi & kilitlenen hayır -->
        <div id="step-1" class="screen active">
            <h1>Sana bişey sorabilir miyim?</h1>
            <div class="gif-box">
                <img src="utan.jpg" alt="Utangaç Kedi">
            </div>
            <div class="btn-group-static">
                <button onclick="goToStep2()" class="btn-yes">Evet</button>
                <button id="runaway-btn" onmouseover="lockButton()" class="btn-no">Hayir</button>
            </div>
        </div>

        <div id="step-2" class="screen">
            <h1>Sorumu kabul ettiğin için çok teşekkür ederim, o zaman soruyorum</h1>
            <div class="gif-box">
                <video src="ziplayan.mp4" autoplay loop muted playsinline></video>
            </div>
            <div id="step2-buttons" class="btn-group-static">
                <button onclick="nextStep(3)" class="btn-yes">Sor bakalım</button>
                <button id="vazgec-btn" onclick="showCryScreen()" class="btn-no">Vazgeçtim</button>
            </div>
        </div>

        <div id="cry-screen" class="screen">
            <h1 style="color: #ef4444;">Hayır vazgeçmedin!</h1>
            <div class="gif-box">
                <img src="kedi.jfif" alt="Ağlayan Kedi">
            </div>
            <p id="timer-text">Lütfen bekleyin, kendinize geliyorsunuz... (3)</p>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div id="step-3" class="screen">
            <h1>ÇOK HEYECANLANDIM ŞİMDİ</h1>
            <div class="gif-box">
                <img src="https://media.giphy.com/media/1wXdlS8vM4V37e1T1w/giphy.gif" alt="Heart Cat">
            </div>
            <div class="btn-group-static">
                <button onclick="nextStep(4)" class="btn-yes">Devam Et</button>
            </div>
        </div>

        <div id="step-4" class="screen">
            <h1>BNİMLE CKAR MSN?</h1>
            <div class="gif-box">
                <img src="cicek.jfif" alt="Çiçek Veren Kedi">
            </div>
            <div class="btn-group-dynamic">
                <button id="final-yes" onclick="sayYes()" class="btn-yes">Evet!</button>
                <button id="final-no" onmouseover="moveFinalNo()" onclick="moveFinalNo()" class="btn-no">Hayir</button>
            </div>
        </div>

        <div id="success-screen" class="screen">
            <h1>Biliyordum Zaten!</h1>
            <div class="gif-box">
                <img src="cift.jfif" alt="Kalp Kuyruklu Kediler">
            </div>
            <p id="success-text">Seni çok güzel sevicem şüphen olmasın ♥</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
